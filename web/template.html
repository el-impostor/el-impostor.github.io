<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Impostor</title>
<meta name="description" content="Juego de deducción para jugar en grupo: con un solo móvil o cada uno en el suyo.">
<meta name="theme-color" content="#15121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impostor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/*STYLES*/
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script src="vendor/qrcode.min.js"></script>
<script>
window.IMPOSTOR_STANDALONE = true;
// servidor de salas (server/); build.py pone aquí la dirección.
// Para probar en local: ?sala-servidor=ws://127.0.0.1:8787 (solo se aceptan servidores locales)
window.IMPOSTOR_RELAY = window.IMPOSTOR_RELAY || (q => /^ws:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(q) ? q : '')(new URLSearchParams(location.search).get('sala-servidor') || '') || '__RELAY_URL__';
/*WORDS*/
/*RULES*/
/*ROOM*/
/*APP*/
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
