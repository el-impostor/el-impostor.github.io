<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Impostor</title>
<meta name="description" content="Juego de deducción para jugar en grupo: con un solo móvil o cada uno en el suyo.">
<meta name="theme-color" content="#15121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impostor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: una columna de móvil (máx. 560px), cabecera fija arriba y barra de acción abajo; tarjetas tipo expediente confidencial. */
:root {
  --bg: #15121b; --bg-2: #1f1a28; --bg-3: #2b2436; --line: #3b3247;
  --fg: #f1ebf5; --fg-2: #a99eb6; --accent: #f1ac45; --accent-ink: #231705;
  --imp: #ff5d62; --crew: #5bd0ae; --warn: #f1ac45; --tile-l: 60%;
  --hatch: rgba(255,255,255,.025); --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 14px; --r-s: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #efecf3; --bg-2: #ffffff; --bg-3: #e3dee9; --line: #d0c8da;
  --fg: #1c1724; --fg-2: #5f5569; --accent: #a86200; --accent-ink: #ffffff;
  --imp: #cf2436; --crew: #0b7f62; --warn: #9a5a00; --tile-l: 40%;
  --hatch: rgba(28,23,36,.03); --shadow: 0 16px 34px -20px rgba(40,20,60,.35); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #efecf3; --bg-2: #ffffff; --bg-3: #e3dee9; --line: #d0c8da;
  --fg: #1c1724; --fg-2: #5f5569; --accent: #a86200; --accent-ink: #ffffff;
  --imp: #cf2436; --crew: #0b7f62; --warn: #9a5a00; --tile-l: 40%;
  --hatch: rgba(28,23,36,.03); --shadow: 0 16px 34px -20px rgba(40,20,60,.35); color-scheme: light;
}

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 22px; height: 22px; flex: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.screen { overflow-x: clip; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; animation: in .22s ease-out; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- cabecera ---------- */
.hd { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hd-in { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.hd-title { flex: 1; margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.hd-sp { width: 44px; }
.hd-meta { min-width: 44px; text-align: right; font-family: var(--f-mono); font-size: .78rem; color: var(--fg-2); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--fg); }
.icon-btn:hover { background: var(--bg-3); }
.icon-btn.sm { width: 38px; height: 38px; color: var(--fg-2); }
.icon-btn:disabled { opacity: .3; }

/* ---------- estructura ---------- */
.pad { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h h2, .sub-h { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); }
.sub-h { margin-top: 6px; }
.count { color: var(--accent); margin-left: 4px; }
.muted { color: var(--fg-2); margin: 0; }
.small { font-size: .88rem; }
.center { text-align: center; }
.note { margin: 0; padding: 12px 14px; border-radius: var(--r-s); background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-2); font-size: .92rem; }
.note.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); color: var(--fg); }
.link { color: var(--accent); font-weight: 600; font-size: .95rem; padding: 6px 2px; }
.lbl { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); }
.big-h { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1; text-transform: uppercase; text-wrap: balance; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r); background: var(--bg-3); color: var(--fg); font-weight: 650; border: 1px solid var(--line); transition: transform .12s, background .15s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; }
.btn.big { min-height: 58px; width: 100%; font-size: 1.08rem; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .88rem; border-radius: var(--r-s); }
.btn.ghost { background: transparent; }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--imp); border-color: color-mix(in srgb, var(--imp) 45%, var(--line)); background: transparent; }
.btn.armed { background: var(--imp); color: #fff; border-color: transparent; }
.btn svg { width: 18px; height: 18px; }
.btn-stack { display: flex; flex-direction: column; line-height: 1.15; }
.btn-stack small { font-weight: 500; font-size: .8rem; opacity: .75; }

.bar { position: sticky; bottom: 0; z-index: 4; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar-in { display: flex; align-items: center; gap: 10px; padding-block: 14px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in.two > * { flex: 1; }
.bar-info { flex: 1; font-family: var(--f-mono); font-size: .8rem; color: var(--fg-2); }
.wrn-t { color: var(--warn); }

/* ---------- inicio ---------- */
.home { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-block: 28px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-top { position: relative; padding: 12px 0 18px; }
.brand-kicker { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); }
.brand-title { margin: 8px 0 10px; font-family: var(--f-display); font-weight: 900; font-size: clamp(3.1rem, 18vw, 7.6rem); overflow-wrap: anywhere; line-height: .82; letter-spacing: -.01em; text-transform: uppercase; }
.brand-sub { margin: 0; max-width: 26ch; font-size: 1.08rem; color: var(--fg-2); }
.stamp-deco { position: absolute; right: 4px; top: 28px; width: 104px; height: 104px; display: grid; place-items: center; border: 3px solid var(--imp); border-radius: 50%; color: var(--imp); font-family: var(--f-display); font-weight: 900; font-size: 4.4rem; transform: rotate(12deg); opacity: .85; box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 8px var(--imp); }
.stamp-deco.sm { position: static; width: 84px; height: 84px; font-size: 3rem; margin: 10px 0; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hcard { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding: 14px; min-height: 104px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); text-align: left; }
.hcard:hover { border-color: var(--fg-2); }
.hcard-k { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-2); }
.hcard-t { margin-top: auto; max-width: 100%; overflow-wrap: anywhere; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.05rem, 4.6vw, 1.5rem); line-height: 1; text-transform: uppercase; }
.home-foot { display: flex; justify-content: center; gap: 28px; margin-top: auto; padding-top: 8px; }
.home-foot .link { color: var(--fg-2); }

/* ---------- modos ---------- */
.modes { display: flex; flex-direction: column; gap: 8px; }
.mode, .modecard { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); text-align: left; width: 100%; }
.mode.on, .modecard { border-color: var(--accent); }
.mode.on { background: color-mix(in srgb, var(--accent) 9%, var(--bg-2)); }
.mode-n { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); padding-top: 4px; min-width: 22px; }
.mode-tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mode-name { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; line-height: 1.05; text-transform: uppercase; }
.mode-tag { color: var(--fg-2); font-size: .9rem; }
.mode-how { margin-top: 6px; font-size: .93rem; color: var(--fg); max-width: 60ch; }

/* ---------- formulario ---------- */
.inp { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r-s); background: var(--bg-2); border: 1px solid var(--line); }
.inp:focus { border-color: var(--accent); outline: none; }
.ta { resize: vertical; min-height: 110px; line-height: 1.4; }
.sel { min-height: 42px; padding: 8px 10px; border-radius: var(--r-s); background: var(--bg-2); border: 1px solid var(--line); max-width: 100%; }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pl { display: flex; align-items: center; gap: 8px; }
.pl-n { font-family: var(--f-mono); font-size: .78rem; color: var(--fg-2); width: 22px; }
.row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row-tx { flex: 1; min-width: 0; }
.row-l { font-weight: 650; }
.row-d { color: var(--fg-2); font-size: .86rem; margin-top: 2px; }
.row-c { flex: none; }
.rule-b { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lock { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-left: 6px; font-weight: 500; white-space: nowrap; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-b { padding: 9px 12px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font-size: .9rem; font-weight: 550; }
.seg-b.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg.is-locked .seg-b:not(.on) { opacity: .35; }
.seg.is-locked .seg-b.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sw { width: 52px; height: 32px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; }
.sw span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg-2); transition: transform .2s, background .2s; }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw.on span { transform: translateX(20px); background: var(--accent-ink); }
.sw:disabled { opacity: .4; }
.stp { display: flex; align-items: center; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.stp-b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
.stp-b:hover:not(:disabled) { background: var(--bg-3); }
.stp-b:disabled { opacity: .3; }
.stp-b svg { width: 18px; height: 18px; }
.stp-v { min-width: 30px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.grp { border-bottom: 1px solid var(--line); }
.grp summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 650; display: flex; justify-content: space-between; }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::after { content: "+"; font-family: var(--f-mono); color: var(--accent); font-size: 1.1rem; }
.grp[open] summary::after { content: "–"; }
.grp-b { padding-bottom: 10px; }
.grp-b .row:last-child, .grp-b .rule-b:last-child { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border-radius: 999px; font-size: .86rem; font-weight: 600; background: color-mix(in srgb, var(--c, var(--fg-2)) 20%, transparent); border: 1px solid color-mix(in srgb, var(--c, var(--fg-2)) 55%, transparent); }
.chip.plain { background: var(--bg-2); border-color: var(--line); font-weight: 500; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .04em; background: var(--bg-3); color: var(--fg-2); }
.wrn-p { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preset { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: var(--r-s); background: var(--bg-2); border: 1px solid var(--line); text-align: left; }
.preset b { font-size: .92rem; }
.preset span { font-size: .78rem; color: var(--fg-2); }
@media (max-width: 420px) { .presets { grid-template-columns: 1fr; } .preset { flex-direction: row; align-items: baseline; gap: 10px; } }
.valid { border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--crew) 55%, var(--line)); background: color-mix(in srgb, var(--crew) 8%, var(--bg-2)); padding: 12px 14px; }
.valid.bad { border-color: color-mix(in srgb, var(--imp) 60%, var(--line)); background: color-mix(in srgb, var(--imp) 8%, var(--bg-2)); }
.valid-h { font-weight: 700; }
.valid ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.valid .err { color: var(--imp); }
.valid .wrn { color: var(--fg-2); }

/* ---------- fichas de categorías ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { position: relative; }
.tile-main { width: 100%; height: 100%; min-height: 126px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; gap: 2px 6px; padding: 10px 12px; border-radius: var(--r-s); background: var(--bg-2); border: 1.5px solid var(--line); text-align: left; transition: background .15s, border-color .15s; }
.tile.on .tile-main { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--bg-2)); }
.tile-n { grid-column: 1; font-family: var(--f-mono); font-size: .74rem; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.tile-ab { grid-column: 1 / 3; grid-row: 2; font-family: var(--f-display); font-weight: 900; font-size: 2.6rem; line-height: .95; color: var(--fg-2); }
.tile.on .tile-ab { color: var(--c); }
.tile-name { grid-column: 1 / 3; font-weight: 650; font-size: .92rem; line-height: 1.15; padding-right: 26px; }
.tile-d { grid-column: 2; grid-row: 1; font-family: var(--f-mono); font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); padding-right: 28px; }
.tile-more { position: absolute; right: 2px; top: 2px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--fg-2); border-radius: 10px; }
.tile-more:hover { background: var(--bg-3); }

/* ---------- gestión de palabras ---------- */
.wls { display: flex; flex-direction: column; gap: 6px; }
.wl { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-s); background: var(--bg-2); border: 1px solid var(--line); text-align: left; width: 100%; }
.wl-ab { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9px; font-family: var(--f-display); font-weight: 900; font-size: 1.4rem; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.wl-tx { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.wl-name { font-weight: 650; }
.wl-meta { font-size: .82rem; color: var(--fg-2); }
.addw { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
@media (max-width: 460px) { .addw { grid-template-columns: 1fr; } }
.import { display: flex; flex-direction: column; gap: 8px; }
.filt .seg-b { padding: 7px 11px; min-height: 36px; font-size: .84rem; }
.wlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.wr { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.wr.is-off .wr-tx { opacity: .45; }
.wr.is-off .wr-w { text-decoration: line-through; }
.wr.editing { flex-wrap: wrap; gap: 8px; padding: 10px 0; }
.wr.editing .inp { flex: 1 1 140px; }
.wr-act { display: flex; gap: 8px; }
.wr-tx { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.wr-w { font-weight: 600; overflow-wrap: anywhere; }
.wr-s { font-size: .8rem; color: var(--fg-2); }
.star { width: 38px; height: 38px; display: grid; place-items: center; color: var(--line); flex: none; }
.star.on { color: var(--accent); }
.star svg { width: 20px; height: 20px; }
.hues { display: flex; flex-wrap: wrap; gap: 8px; }
.hue { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line); }
.hue.on { box-shadow: 0 0 0 2px var(--fg); }

/* ---------- antes de empezar ---------- */
.intro-n { font-family: var(--f-mono); color: var(--accent); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
.intro-t { margin: -8px 0 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: .92; text-transform: uppercase; text-wrap: balance; }
.intro-how { margin: 0; font-size: 1.08rem; max-width: 60ch; }
.facts { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.facts li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.facts li::before { content: "— "; color: var(--accent); }

/* ---------- pasar el móvil ---------- */
.pass { align-items: center; justify-content: center; text-align: center; }
.pass-k { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.pass-l { margin: 0; color: var(--fg-2); font-size: 1.1rem; }
.pass-name { font-family: var(--f-display); font-weight: 900; font-size: clamp(3.2rem, 17vw, 5.4rem); line-height: .9; text-transform: uppercase; overflow-wrap: anywhere; max-width: 100%; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--bg-3); }
.dots .done { background: var(--fg-2); }
.dots .cur { background: var(--accent); }
.quit { width: 100%; padding: 14px; border-radius: var(--r); border: 1px solid var(--imp); background: color-mix(in srgb, var(--imp) 10%, var(--bg-2)); text-align: left; }
.quit p { margin: 0 0 10px; }

/* ---------- tarjeta de papel ---------- */
.reveal { justify-content: center; }
.card { perspective: 1400px; width: 100%; max-width: 380px; margin: 0 auto; aspect-ratio: 3 / 4; max-height: 62vh; }

/* temporizador */

    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;

  /* RNG criptográfico cuando existe (reparto justo); Math.random si no */

      rules: { guess: 'win' }, locked: [] },
    { id: 'limitadas', n: 11, name: 'Pistas limitadas', tag: 'Cada palabra cuenta',
      how: 'Cada jugador tiene un número máximo de pistas en toda la partida. Se anotan en la app, que detecta repeticiones y pistas que contienen la palabra y las penaliza.',
      rules: { registerClues: true, maxClues: 2, cluePenalty: 'lose', clueRounds: 1 }, locked: ['registerClues'] },
    { id: 'aleatorio', n: 13, name: 'Impostores aleatorios', tag: '¿Cuántos hay?',
      how: 'Al repartir, la app elige al azar cuántos impostores hay dentro del rango que marques. Nadie sabe el número. Puedes decidir si los impostores se conocen entre ellos. Cada vez que echéis a alguien, la app dirá si quedan impostores o si ya habéis ganado.',
      rules: { randomImpostors: true, knowEachOther: false, impostorInfo: 'none' }, locked: ['randomImpostors'] },
    { id: 'personalizado', n: 12, name: 'Personalizado', tag: 'Tus reglas',
      how: 'Combina las reglas como quieras: número de impostores, qué saben, tiempos, tipo de pista, votación y última oportunidad.',
      rules: {}, locked: [] }
  ];
  const modeById = id => MODES.find(m => m.id === id) || MODES[0];
  const maxImpostors = n => Math.max(1, Math.ceil(n / 2) - 1);
  /* rango real de impostores para n jugadores */
  function impostorRange(r, n) {
    const top = maxImpostors(n);
    if (!r.randomImpostors) return [r.impostors, r.impostors];
    const hi = Math.min(r.impMax > 0 ? r.impMax : top, top);
    return [Math.min(Math.max(1, r.impMin), hi), hi];
  }

  function rulesForMode(modeId, base) {
    const m = modeById(modeId);
    const r = Object.assign(defaultRules(), base || {});
    const mr = JSON.parse(JSON.stringify(m.rules));
    Object.assign(r, mr);
    if (m.minImpostors && r.impostors < m.minImpostors) r.impostors = m.minImpostors;
    return r;
  }

  /* ---------- ajustes recomendados ---------- */
  const PRESETS = {
    rapida: { name: 'Partida rápida', desc: 'Una ronda de pistas y una sola votación.',
      apply: (r) => Object.assign(r, { clueRounds: 1, maxRounds: 1, voting: 'group', timers: { clue: 20, debate: 60, vote: 0 } }) },
    larga: { name: 'Partida larga', desc: 'Dos rondas de pistas, votaciones hasta el final y última oportunidad.',
      apply: (r) => Object.assign(r, { clueRounds: 2, maxRounds: 0, guess: r.guess === 'off' ? 'win' : r.guess, timers: { clue: 0, debate: 0, vote: 0 } }) },
    grupo: { name: 'Grupo numeroso', desc: 'Más impostores, debate con tiempo y voto en grupo.',
      apply: (r, n) => Object.assign(r, { impostors: Math.max(2, Math.floor((n || 8) / 4)), clueRounds: 1, maxRounds: 0, voting: 'group', timers: { clue: 15, debate: 120, vote: 0 } }) }
  };

  /* ---------- catálogo: palabras oficiales + personalizadas ---------- */
  // store: { custom:[{id,name,desc,h,words:[{id,w,sim}]}], added:{catId:[{id,w,sim}]}, wordState:{key:{off,fav}}, subOff:{'cat/sub':true} }
  function buildCatalog(official, store) {
    const st = store || {};
    const ws = st.wordState || {}, added = st.added || {}, subOff = st.subOff || {};
    const cats = [];
    const mkWord = (catId, w, sim, extra) => {
      const key = extra && (extra.img || extra.data) ? catId + '::img:' + extra.id : keyOf(catId, w);
      const s = ws[key] || {};
      return Object.assign({ key, w, sim: sim || '', off: !!s.off, fav: !!s.fav }, extra);
    };
    for (const c of official) {
      const words = [];
      const subs = [];
      if (c.subs) {
        for (const s of c.subs) {
          const subDisabled = !!subOff[c.id + '/' + s.id];
          subs.push({ id: s.id, name: s.name, off: subDisabled, count: s.words.length });
          for (const raw of s.words) { const p = splitWord(raw); words.push(mkWord(c.id, p.w, p.sim, { sub: s.id, subOff: subDisabled, user: false })); }
        }
      } else {
        for (const raw of c.words) { const p = splitWord(raw); words.push(mkWord(c.id, p.w, p.sim, { user: false })); }
      }
      for (const a of (added[c.id] || [])) words.push(mkWord(c.id, a.w, a.sim, { id: a.id, user: true, img: a.img || '', data: a.data || '' }));
      cats.push({ id: c.id, name: c.name, desc: c.desc, ab: c.ab, h: c.h, d: c.d, adult: !!c.adult, custom: false, subs, words });
    }
    for (const c of (st.custom || [])) {
      cats.push({ id: c.id, name: c.name, desc: c.desc || 'Lista personalizada', ab: abbr(c.name), h: c.h == null ? 160 : c.h, d: 2,
        custom: true, subs: [], words: (c.words || []).map(a => mkWord(c.id, a.w, a.sim, { id: a.id, user: true, img: a.img || '', data: a.data || '' })) });
    }
    return cats;
  }
  function abbr(name) {
    const parts = String(name || '?').trim().split(/\s+/);
    const a = parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].slice(0, 2);
    return a.charAt(0).toUpperCase() + a.slice(1).toLowerCase();
  }

  /* palabras disponibles para una partida */
  function buildPool(catalog, cfg, usedKeys) {
    const r = cfg.rules;
    const sel = new Set(cfg.cats || []);
    let pool = [], skippedImg = 0;
    for (const c of catalog) {
      if (!sel.has(c.id)) continue;
      if (r.difficulty === 'easy' && c.d >= 3) continue;
      if (r.difficulty === 'hard' && c.d < 2) continue;
      for (const w of c.words) {
        if (w.off || w.subOff) continue;
        if (!r.useCustom && (w.user || c.custom)) continue;
        if (r.favOnly && !w.fav) continue;
        // en modo sala solo valen imágenes subidas (las locales no llegan a otros móviles)
        if (cfg.jam && w.data && !w.img) { skippedImg++; continue; }
        pool.push({ key: w.key, w: w.w, sim: w.sim, catId: c.id, catName: c.name, sub: w.sub, img: w.img || '', data: w.data || '' });
      }
    }
    // modos con palabra parecida: hace falta una alternativa
    if (r.impostorInfo === 'similar' || r.impostorInfo === 'unaware') {
      const perCat = {};
      pool.forEach(p => { perCat[p.catId] = (perCat[p.catId] || 0) + 1; });
      pool = pool.filter(p => p.sim || perCat[p.catId] >= 2);
    }
    const total = pool.length;
    let recycled = false;
    if (r.avoidRepeats && usedKeys && usedKeys.length) {
      const used = new Set(usedKeys);
      const fresh = pool.filter(p => !used.has(p.key));
      if (fresh.length) pool = fresh; else if (total) recycled = true;
    }
    return { pool, total, recycled, skippedImg };
  }

  /* ---------- validación ---------- */
  function validate(cfg, poolInfo) {
    const errors = [], warnings = [];
    const r = cfg.rules;
    const names = (cfg.players || []).map(p => String(p || '').trim());
    const n = names.length, k = r.impostors;
    const m = modeById(cfg.mode);
    if (n < 3) errors.push('Hacen falta al menos 3 jugadores.');
    if (n > 30) errors.push('El máximo es de 30 jugadores.');
    const seen = new Set();
    for (const nm of names) {
      const x = norm(nm);
      if (!x) continue;
      if (seen.has(x)) { errors.push(`Hay dos jugadores llamados «${nm}». Cambia uno de los nombres.`); break; }
      seen.add(x);
    }
    if (r.randomImpostors) {
      if (r.impMax > 0 && r.impMin > r.impMax) errors.push('El mínimo de impostores no puede ser mayor que el máximo.');
      else if (n >= 3 && r.impMin > maxImpostors(n)) errors.push(`Con ${n} jugadores puede haber como mucho ${maxImpostors(n)} impostor${maxImpostors(n) === 1 ? '' : 'es'}: baja el mínimo.`);
      else if (n >= 3) { const [a, b] = impostorRange(r, n); if (a === b) warnings.push(`Con ${n} jugadores el rango solo permite ${a} impostor${a === 1 ? '' : 'es'}: no habrá sorpresa.`); }
      if (r.maxRounds > 0 && n >= 3 && r.maxRounds < impostorRange(r, n)[1]) warnings.push('Puede haber más impostores que votaciones: quizá no dé tiempo a descubrirlos a todos.');
    }
    if (!r.randomImpostors && k < 1) errors.push('Tiene que haber al menos un impostor.');
    if (!r.randomImpostors && m.minImpostors && k < m.minImpostors) errors.push(`El modo ${m.name} necesita al menos ${m.minImpostors} impostores.`);
    if (!r.randomImpostors && n >= 3 && k * 2 >= n) errors.push(`Con ${n} jugadores puede haber como mucho ${Math.max(1, Math.ceil(n / 2) - 1)} impostor${Math.ceil(n / 2) - 1 === 1 ? '' : 'es'}: debe haber más jugadores normales que impostores.`);
    if (!cfg.cats || !cfg.cats.length) errors.push('Elige al menos una categoría.');
    else if (poolInfo && poolInfo.total === 0) {
      errors.push((r.impostorInfo === 'similar' || r.impostorInfo === 'unaware')
        ? 'No hay palabras utilizables: este modo necesita palabras con pareja o categorías con al menos dos palabras activas.'
        : 'No hay palabras disponibles con esta selección. Revisa categorías, dificultad, favoritas o palabras desactivadas.');
    }
    if (!r.randomImpostors && r.maxRounds > 0 && r.maxRounds < k) errors.push(`Con ${k} impostores hacen falta al menos ${k} votaciones para poder descubrirlos a todos.`);
    if (r.clueRounds < 1) errors.push('Tiene que haber al menos una ronda de pistas.');
    // avisos
    if (poolInfo && poolInfo.total > 0 && poolInfo.total < 10) warnings.push(`Solo hay ${poolInfo.total} palabra${poolInfo.total === 1 ? '' : 's'} disponible${poolInfo.total === 1 ? '' : 's'}: se repetirán a menudo.`);
    if (poolInfo && poolInfo.skippedImg) warnings.push(`${poolInfo.skippedImg === 1 ? 'Una imagen guardada solo en este móvil no se usará' : poolInfo.skippedImg + ' imágenes guardadas solo en este móvil no se usarán'}: en la sala solo valen las imágenes subidas.`);
    if (poolInfo && poolInfo.recycled) warnings.push('Ya han salido todas las palabras de esta selección; vuelven a estar disponibles.');
    if (r.hideCategory && cfg.cats && cfg.cats.length === 1) warnings.push('Con una sola categoría el impostor puede deducirla fácilmente. Mejor mezclar varias.');
    if (!r.randomImpostors && k >= 2 && n < 6) warnings.push('Con menos de 6 jugadores, dos impostores lo tienen muy fácil.');
    if (r.cluePenalty !== 'none' && !r.registerClues) warnings.push('Las penalizaciones por pistas repetidas solo funcionan si se anotan las pistas.');
    if (r.voting === 'secret' && r.timers.vote) warnings.push('El tiempo de votación solo se aplica al voto en grupo.');
    if (r.maxClues > 0 && r.maxClues < r.clueRounds) warnings.push(`Cada jugador tiene ${r.maxClues} pista${r.maxClues === 1 ? '' : 's'} pero hay ${r.clueRounds} rondas: alguien se quedará sin hablar.`);
    if (r.impostorInfo === 'unaware' && r.guess !== 'off') warnings.push('El infiltrado no sabe que lo es, pero podrá adivinar la palabra si lo descubren.');
    return { errors, warnings, ok: errors.length === 0 };
  }

  /* ---------- crear partida ---------- */
  function assignRoles(n, k, rng) {
    const idx = shuffle([...Array(n).keys()], rng || defaultRng);
    const imp = new Set(idx.slice(0, k));
    return [...Array(n).keys()].map(i => imp.has(i) ? 'impostor' : 'crew');
  }

  /* palabra (o imagen) parecida para el impostor */
  function similarFor(secret, pool, rng) {
    if (!secret.img && !secret.data && secret.sim && norm(secret.sim) !== norm(secret.w)) return { w: secret.sim, img: '', data: '' };
    const others = pool.filter(p => p.catId === secret.catId && p.key !== secret.key && (secret.img || secret.data || norm(p.w) !== norm(secret.w)));
    const o = others.length ? pick(others, rng) : null;
    return o ? { w: o.w, img: o.img || '', data: o.data || '' } : { w: '', img: '', data: '' };
  }

  function createGame(cfg, pool, rng) {
    rng = rng || defaultRng;
    const r = JSON.parse(JSON.stringify(cfg.rules));
    const names = cfg.players.map((p, i) => String(p || '').trim() || `Jugador ${i + 1}`);
    if (r.randomImpostors) { const [a, b] = impostorRange(r, names.length); r.impostors = a + Math.floor(rng() * (b - a + 1)); }
    const roles = assignRoles(names.length, r.impostors, rng);
    const secret = Object.assign({}, pick(pool, rng));
    if (r.impostorInfo === 'similar' || r.impostorInfo === 'unaware') {
      const sm = similarFor(secret, pool, rng); secret.imp = sm.w; secret.impImg = sm.img; secret.impData = sm.data;
    }
    const players = names.map((name, i) => ({ name, role: roles[i], alive: true, cluesLeft: r.maxClues || 0, penalties: 0, votedOut: 0 }));
    return {
      id: Date.now().toString(36) + Math.floor(rng() * 1e6).toString(36),
      mode: cfg.mode, rules: r, cats: cfg.cats.slice(), players, secret,
      start: Math.floor(rng() * names.length),
      round: 1, clueRound: 1, turn: 0, phase: 'reveal', revealIdx: 0,
      clues: [], events: [], partial: [], result: null, startedAt: Date.now()
    };
  }

  /* qué ve cada jugador en su tarjeta */
  function cardFor(game, i) {
    const p = game.players[i], r = game.rules, s = game.secret;
    const showCat = !r.hideCategory;
    const pic = (img, data) => ({ img: img || '', data: data || '' });
    if (p.role === 'crew') return Object.assign({ kind: 'crew', word: s.w, category: showCat ? s.catName : '' }, r.randomImpostors ? { note: 'Puede haber uno o varios impostores. Nadie sabe cuántos.' } : {}, pic(s.img, s.data));
    // impostor
    const mates = r.impostors > 1 && r.knowEachOther && r.impostorInfo !== 'unaware'
      ? game.players.filter((q, j) => j !== i && q.role === 'impostor').map(q => q.name) : [];
    const alone = r.randomImpostors && !r.knowEachOther ? ' Puede haber más impostores, pero no sabes quiénes ni cuántos.' : (r.randomImpostors && r.knowEachOther && r.impostors === 1 ? ' Esta vez eres el único impostor.' : '');
    if (r.impostorInfo === 'unaware') return Object.assign({ kind: 'crew', word: s.imp, category: showCat ? s.catName : '' }, pic(s.impImg, s.impData));
    if (r.impostorInfo === 'similar') return Object.assign({ kind: 'impostor', word: s.imp, category: showCat ? s.catName : '', note: ((s.img || s.data) ? 'Tu imagen se parece a la de los demás, pero no es la misma.' : 'Tu palabra es parecida a la de los demás, pero no es la misma.') + alone, mates }, pic(s.impImg, s.impData));
    if (r.impostorInfo === 'category') return { kind: 'impostor', word: '', category: s.catName, note: 'No conoces la palabra, pero sí su categoría.' + alone, mates };
    return { kind: 'impostor', word: '', category: '', note: (r.hideCategory ? 'No sabes ni la palabra ni la categoría.' : 'No conoces la palabra. Escucha y disimula.') + alone, mates };
  }

  /* orden de turnos de la ronda actual: jugadores vivos empezando por "start" */
  function turnOrder(game) {
    const n = game.players.length, out = [];
    const offset = (game.start + game.round - 1 + game.clueRound - 1) % n;
    for (let j = 0; j < n; j++) { const i = (offset + j) % n; if (game.players[i].alive) out.push(i); }
    return out;
  }

  /* en «preguntas»: quién pregunta a quién */
  function questionTarget(game, order, t, rng) {
    if (order.length < 2) return null;
    // pregunta al siguiente en el orden (simple y justo: todos preguntan y responden una vez)
    return order[(t + 1) % order.length];
  }

  function clueCondition(rules, roundSeed, rng) {
    rng = rng || defaultRng;
    let type = rules.clueType;
    if (type === 'aleatoria') type = pick(['una', 'frase', 'asociacion', 'gesto', 'pregunta'], rng);
    return { type, label: CLUE_TYPES[type].label, hint: CLUE_TYPES[type].hint };
  }

  /* comprobar una pista anotada */
  function checkClue(game, playerIdx, text) {
    const t = norm(text);
    if (!t) return { empty: true, repeat: false, obvious: false };
    const words = [game.secret.w, game.secret.imp].filter(Boolean).map(norm);
    const padded = ' ' + t + ' ';
    const obvious = words.some(w => w && (padded.includes(' ' + w + ' ') || t === w));
    const repeat = game.clues.some(c => c.text && norm(c.text) === t);
    return { empty: false, repeat, obvious };
  }

  /* ---------- votación ---------- */
  // votes: array de índices votados (-1 = en blanco). alive: índices vivos
  function tally(votes, tieRule, rng) {
    rng = rng || defaultRng;
    const counts = {};
    votes.forEach(v => { if (v >= 0) counts[v] = (counts[v] || 0) + 1; });
    const entries = Object.entries(counts).map(([i, c]) => [Number(i), c]);
    if (!entries.length) return { counts, top: [], eliminated: null, tie: false };
    const max = Math.max(...entries.map(e => e[1]));
    const top = entries.filter(e => e[1] === max).map(e => e[0]);
    if (top.length === 1) return { counts, top, eliminated: top[0], tie: false };
    if (tieRule === 'random') return { counts, top, eliminated: pick(top, rng), tie: true };
    if (tieRule === 'revote') return { counts, top, eliminated: null, tie: true, revote: true };
    return { counts, top, eliminated: null, tie: true };
  }

  function aliveCounts(game) {
    let imp = 0, crew = 0;
    game.players.forEach(p => { if (p.alive) { if (p.role === 'impostor') imp++; else crew++; } });
    return { imp, crew };
  }

  function eliminate(game, i) {
    const p = game.players[i];
    p.alive = false;
    game.events.push({ t: 'elim', round: game.round, idx: i, role: p.role });
    return p.role === 'impostor';
  }

  /* ¿ha terminado la partida? Se llama tras resolver cada votación. */
  function checkWin(game) {
    const r = game.rules;
    const { imp, crew } = aliveCounts(game);
    if (game.forcedWinner) return { winner: game.forcedWinner, reason: game.forcedReason || 'guess' };
    if (imp === 0) return { winner: 'crew', reason: 'caught' };
    if (r.winRule === 'parity' ? imp >= crew : imp > crew) return { winner: 'impostors', reason: 'numbers' };
    if (imp + crew <= 2) return { winner: 'impostors', reason: 'numbers' };
    if (r.maxRounds > 0 && game.round >= r.maxRounds) return { winner: 'impostors', reason: 'survived' };
    return null;
  }

  /* intento de adivinar la palabra del impostor descubierto */
  function guessMatches(game, text) {
    const g = norm(text), w = norm(game.secret.w);
    if (!g) return false;
    if (g === w) return true;
    // admite plurales y artículos sencillos
    const strip = s => s.replace(/^(el|la|los|las|un|una) /, '').replace(/(es|s)$/, '');
    return strip(g) === strip(w);
  }

  function applyGuess(game, idx, correct) {
    game.events.push({ t: 'guess', idx, correct });
    if (!correct) return;
    if (game.rules.guess === 'win') { game.forcedWinner = 'impostors'; game.forcedReason = 'guess'; }
    else if (game.rules.guess === 'partial') game.partial.push(idx);
  }

  /* qué decir tras una votación: seguir jugando o fin (sin revelar cuántos quedan) */
  function statusAfterVote(game) {
    const w = checkWin(game);
    if (w && w.winner === 'crew') return { kind: 'crew', text: 'No quedan impostores. ¡Ganan los jugadores!' };
    if (w) return { kind: 'imp', text: w.reason === 'survived' ? 'Se acabaron las votaciones con algún impostor dentro.' : w.reason === 'guess' ? 'El impostor ha adivinado la palabra.' : 'Los impostores ya son tantos como los demás. Ganan ellos.' };
    const last = game.events.filter(e => e.t === 'elim').pop();
    const caughtNow = last && last.round === game.round && last.role === 'impostor';
    return { kind: 'go', text: caughtNow ? 'Aún queda al menos un impostor. Seguid jugando.' : 'Al menos un impostor sigue entre vosotros. Seguid jugando.' };
  }
  return {
    norm, keyOf, maxImpostors, impostorRange, statusAfterVote, shuffle, defaultRng, splitWord, abbr,
    CLUE_TYPES, MODES, PRESETS, modeById, defaultRules, rulesForMode,
    buildCatalog, buildPool, validate,
    assignRoles, createGame, cardFor, turnOrder, questionTarget, clueCondition, checkClue,
    tally, aliveCounts, eliminate, checkWin, guessMatches, applyGuess
  };
})();

if (false) module.exports = Rules;

/* =========================================================
   SALA SIN CUENTA (versión web): conexión directa entre móviles con PeerJS.
   El móvil del anfitrión hace de centro: los jugadores se conectan a él y
   él reenvía el estado. Expone la misma interfaz que usa jam.js:
   join(name, {hub}) -> { emit, on, presence, onPeers, peers, leave }
   ========================================================= */
const PeerRoom = (() => {
  const PREFIX = 'elimpostor-v1-';
  const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] };
  const available = () => typeof Peer !== 'undefined';
  const freeze = o => Object.freeze(o);

  function join(name, opts) {
    if (!available()) return Promise.reject({ code: 'not_granted', message: 'No se pudo cargar la conexión entre móviles. Revisa tu conexión a internet.' });
    return (opts && opts.hub) ? hub(name) : client(name);
  }

  /* ---------- anfitrión (centro) ---------- */
  function hub(name) {
    return new Promise((resolve, reject) => {
      const myId = PREFIX + name;
      const topics = {}, peerFns = [], errFns = [];
      const conns = new Map();            // peerId -> { conn, presence }
      let myPresence = {}, list = freeze([]), opened = false, closed = false;
      const peer = new Peer(myId, { debug: 0, config: ICE });

      function snapshot(forId) {
        const arr = [{ peer: myId, presence: myPresence }];
        conns.forEach((c, id) => arr.push({ peer: id, presence: c.presence }));
        return arr.map(p => freeze({ peer: p.peer, by: null, isMe: p.peer === forId, sameTab: p.peer === forId, kind: 'viewer', guest: false, presence: freeze(Object.assign({}, p.presence)), updatedAt: Date.now() }));
      }
      function publish(joinedIds) {
        list = freeze(snapshot(myId));
        const change = { peers: list, joined: list.filter(p => joinedIds.includes(p.peer)), left: [], updated: [] };
        peerFns.forEach(fn => { try { fn(change); } catch (e) {} });
        const raw = snapshot(null).map(p => ({ peer: p.peer, presence: p.presence }));
        conns.forEach((c) => { if (c.conn.open) try { c.conn.send({ t: 'peers', peers: raw, joined: joinedIds }); } catch (e) {} });
      }
      peer.on('open', () => {
        opened = true;
        resolve(freeze({
          name,
          emit: async (topic, data) => {

          presence: async patch => { for (const k in patch) { if (patch[k] === null) delete myPresence[k]; else myPresence[k] = patch[k]; } publish([]); },
          peers: () => list,

          connected: () => !peer.disconnected && !closed,
          leave: async () => { closed = true; conns.forEach(c => { try { c.conn.close(); } catch (e) {} }); try { peer.destroy(); } catch (e) {} }
        }));
      });

        conn.on('open', () => { conns.set(conn.peer, { conn, presence: {} }); publish([conn.peer]); });
        conn.on('data', m => {
          if (!m || typeof m !== 'object') return;

  function client(name) {

      const api = freeze({
        name,
        emit: async () => {},
        on: (topic, fn) => { (topics[topic] = topics[topic] || []).push(fn); return () => { topics[topic] = topics[topic].filter(f => f !== fn); }; },
        presence: async patch => {
          for (const k in patch) { if (patch[k] === null) delete myPresence[k]; else myPresence[k] = patch[k]; }

        peers: () => list,

      peer.on('disconnected', () => { if (!closed) setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
      peer.on('error', err => {
        if (err && err.type === 'peer-unavailable') { if (!closed) retry = setTimeout(connect, 2500); return; }
        if (!resolved) { resolved = true; try { peer.destroy(); } catch (e) {} reject({ code: 'upstream_error', message: String(err && err.type) }); }
      });
      setTimeout(() => { if (!resolved) { resolved = true; closed = true; try { peer.destroy(); } catch (e) {} reject({ code: 'not_found', message: 'timeout' }); } }, 20000);
    });
  }

})();
