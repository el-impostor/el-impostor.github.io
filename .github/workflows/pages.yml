# Compila la versión web y la publica en GitHub Pages en cada push a main.
# La dirección del servidor de salas sale de server/relay-url.txt
# (o de la variable del repositorio RELAY_URL, si existe).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar
        run: python build.py
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Pruebas de lógica
        run: node test/rules.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
